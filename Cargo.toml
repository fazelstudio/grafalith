[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
# Third-party-style examples live outside the engine workspace (they consume
# the engine through path dependencies like an external user would).
exclude = ["examples/*"]

# Workspace-level lint discipline.
# Member crates opt in via `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
