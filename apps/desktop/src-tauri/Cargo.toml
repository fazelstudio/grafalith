[package]
name = "opennary-desktop"
version = "0.1.0"
description = "OpenNary desktop app — Tauri host for the Rust engine"
edition = "2021"

[lib]
name = "opennary_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-snap-layout = "1"
opennary-bindings = { path = "../../../crates/opennary-bindings" }
opennary-core = { path = "../../../crates/opennary-core" }

[lints]
workspace = true
