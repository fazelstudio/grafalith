[package]
name = "grafalith-desktop"
version = "0.1.0"
description = "Grafalith desktop app — Tauri host for the Rust engine"
edition = "2021"
# Application binary, not a library: the desktop host is built with
# `bun run tauri:build`, never published to crates.io.
publish = false

[lib]
name = "grafalith_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-snap-layout = "1"
grafalith-bindings = { path = "../../../crates/grafalith-bindings" }
grafalith-core = { path = "../../../crates/grafalith-core" }
grafalith-sdk = { path = "../../../crates/grafalith-sdk" }

[lints]
workspace = true
