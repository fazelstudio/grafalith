name: Release desktop

# Build the Tauri desktop app for Windows, macOS, and Linux.
#
# How to cut a release:
#   1. Bump the version in apps/desktop/src-tauri/tauri.conf.json
#      (plus src-tauri/Cargo.toml and apps/desktop/package.json).
#   2. Commit, tag, and push the tag:
#        git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#   3. This workflow builds all three platforms. On a tag push it also
#      publishes a GitHub Release with the installers attached.
#
# A manual run (Actions tab -> Release desktop -> Run workflow) only builds
# and uploads per-OS artifacts for inspection, without creating a Release.
#
# Notes:
# - Artifacts are unsigned: macOS shows a Gatekeeper warning and Windows
#   shows SmartScreen until signing is configured (Tauri signing docs).
# - Ubuntu 22.04 is used so the .deb/.AppImage run on more distributions.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            release-files: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            release-files: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            release-files: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        run: bun run --filter @fazelstudio/desktop tauri:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nary-desktop-${{ matrix.os }}
          path: ${{ matrix.release-files }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release-files }}
          generate_release_notes: true
