name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check generated bindings
        run: python3 scripts/gen_command_bindings.py --check

      - name: Verify docs
        run: python3 scripts/verify-docs.py

  desktop:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: bun install

      - name: Type check desktop
        run: bun run --filter @fazelstudio/desktop typecheck

      - name: Verify locales
        run: bun run --filter @fazelstudio/desktop i18n:verify

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build wasm (node target)
        run: bun run build:wasm:node

      - name: Typecheck TS SDK
        run: bun run --filter @fazelstudio/nary-sdk typecheck

      - name: Run TS extension example
        run: bun run --filter @fazelstudio/nary-sdk example

  wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with wasm32
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check npm crate for wasm32
        run: cargo check -p nary --target wasm32-unknown-unknown

  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Build Python wheels
        working-directory: crates/nary-python
        run: maturin build

      - name: Install wheel and run integration tests
        run: |
          whl=$(ls target/wheels/*.whl dist/*.whl 2>/dev/null | head -1)
          pip install "$whl"
          python -m unittest discover -s crates/nary-python/tests -v
