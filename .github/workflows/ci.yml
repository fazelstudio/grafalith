name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint (zero errors and warnings)
        run: bun run lint

      - name: Type check core
        run: bun run --filter @fazelstudio/fazelidraw typecheck

      - name: Type check react
        run: bun run --filter @fazelstudio/react typecheck

      - name: Run tests
        run: bun run --filter @fazelstudio/fazelidraw test

      - name: Build core
        run: bun run --filter @fazelstudio/fazelidraw build

      - name: Build react
        run: bun run --filter @fazelstudio/react build

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace
