name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: |
            crates/grafalith-io/fuzz/corpus/import_scene
            crates/grafalith-io/fuzz/corpus/clipboard
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Fuzz scene import (short run)
        working-directory: crates/grafalith-io/fuzz
        run: cargo +nightly fuzz run import_scene -- -max_total_time=120

      - name: Fuzz clipboard codec (short run)
        working-directory: crates/grafalith-io/fuzz
        run: cargo +nightly fuzz run clipboard -- -max_total_time=60
