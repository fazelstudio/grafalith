[package]
name = "nary-bindings"
version = "0.1.0"
edition = "2021"
description = "Host boundary for the Nary Rust engine: deliberate JS/WASM facade over document, commands, clipboard, and interchange. JSON-string protocol; no Rust internals cross the boundary."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nary-core = { version = "0.1.0", path = "../nary-core" }
nary-io = { version = "0.1.0", path = "../nary-io" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
wasm-bindgen = "0.2"

# Host-gated SVG import (M8): enabling `svg` pulls usvg through nary-io.
# Default builds stay lean (no text-shaping stack in the base wasm).
[features]
svg = ["nary-io/svg"]

# Benchmark harness (dev-only: never ships in library artifacts — M5).
[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "poll"
harness = false

[lints]
workspace = true
