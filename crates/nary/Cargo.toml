[package]
name = "nary"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM/npm distribution of the Nary Rust engine: wasm-bindgen facade over nary-bindings for browser and Node.js hosts. JSON-string protocol; string-only, never throws. Published to npm as @fazelstudio/nary."
repository = "https://github.com/fazelstudio/opennary"
homepage = "https://github.com/fazelstudio/opennary"
keywords = ["canvas", "whiteboard", "wasm", "graphics", "editor"]

[lib]
crate-type = ["cdylib"]

# wasm-opt is disabled by default: the prebuilt binary wasm-pack downloads
# is not reliable on all Windows hosts. Enable it for release publishes
# (`wasm-opt = true`) where the extra optimization pass is worth the risk.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
nary-bindings = { version = "0.1.0", path = "../nary-bindings" }
wasm-bindgen = "0.2"
serde_json = "1"

# Host-gated SVG import: forwards usvg through the bindings so the
# default npm artifact stays lean.
[features]
svg = ["nary-bindings/svg"]

[lints]
workspace = true
