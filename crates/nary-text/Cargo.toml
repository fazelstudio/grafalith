[package]
name = "nary-text"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Text measurement and shaping helpers for the Nary Rust engine: measurement and line breaking behind the core TextMeasurer seam. Host-gated; nary-core never depends on this crate."

[dependencies]
nary-core = { version = "0.1.0", path = "../nary-core" }
# Layout engine: shaping, line breaking, bidi. Pure Rust, WASM-safe;
# hosts register fonts.
parley = "0.11"

[lints]
workspace = true
