[package]
name = "grafalith-bindings"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["fazelstudio"]
description = "Host boundary for the Grafalith Rust engine: deliberate JS/WASM facade over document, commands, clipboard, and interchange. JSON-string protocol; no Rust internals cross the boundary."
repository = "https://github.com/fazelstudio/grafalith"
homepage = "https://github.com/fazelstudio/grafalith"
keywords = ["canvas", "wasm", "bindings", "graphics", "engine"]
categories = ["graphics", "wasm", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
grafalith-core = { version = "0.1.0", path = "../grafalith-core" }
grafalith-io = { version = "0.1.0", path = "../grafalith-io" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
wasm-bindgen = "0.2"

# Host-gated SVG import: enabling `svg` pulls usvg through grafalith-io.
# Default builds stay lean (no text-shaping stack in the base wasm).
[features]
svg = ["grafalith-io/svg"]

# Benchmark harness for local runs.
[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "poll"
harness = false

[lints]
workspace = true
