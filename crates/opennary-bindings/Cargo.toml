[package]
name = "opennary-bindings"
version = "0.1.0"
edition = "2021"
description = "Host boundary for the OpenNary Rust engine: deliberate JS/WASM facade over document, commands, clipboard, and interchange. JSON-string protocol; no Rust internals cross the boundary."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opennary-core = { version = "0.1.0", path = "../opennary-core" }
opennary-io = { version = "0.1.0", path = "../opennary-io" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
wasm-bindgen = "0.2"

# Host-gated SVG import: enabling `svg` pulls usvg through opennary-io.
# Default builds stay lean (no text-shaping stack in the base wasm).
[features]
svg = ["opennary-io/svg"]

# Benchmark harness for local runs.
[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "poll"
harness = false

[lints]
workspace = true
