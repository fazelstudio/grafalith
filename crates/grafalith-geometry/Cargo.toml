[package]
name = "grafalith-geometry"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["fazelstudio"]
description = "Pure 2D math for the Grafalith Rust engine: points, bounds, transforms, viewport math, spatial index, snapping. No host, no document, no UI."
repository = "https://github.com/fazelstudio/grafalith"
homepage = "https://github.com/fazelstudio/grafalith"
keywords = ["geometry", "2d", "graphics", "math", "bounds"]
categories = ["graphics", "mathematics"]

# Property harness for local runs.
[dev-dependencies]
proptest = "1"

[lints]
workspace = true
