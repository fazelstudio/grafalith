[package]
name = "nary-core"
version = "0.1.0"
edition = "2021"
description = "Document domain for the Nary Rust engine: elements, document store, history, registries. Framework-agnostic; depends only on nary-geometry."
license = "MIT"

[dependencies]
nary-geometry = { version = "0.1.0", path = "../nary-geometry" }
# Polygon boolean ops (ADR-0020): pure Rust, WASM-safe, empty default
# features (no rayon unless a benchmark ever justifies threads in core).
i_overlay = { version = "9", default-features = false }

# Benchmark + property harnesses (dev-only: never ship in library
# artifacts, zero bundle-size impact — M5).
[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "scale"
harness = false

[lints]
workspace = true
