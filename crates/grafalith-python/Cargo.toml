[package]
name = "grafalith-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
# PyPI-only artifact: this crate is a PyO3 extension module (`cdylib`), not a
# library Rust projects can depend on. maturin builds it into the `grafalith`
# wheel; crates.io distribution belongs to the engine crates.
publish = false
description = "Python (PyO3/maturin) distribution of the Grafalith Rust engine: instance-scoped editor, JSON batch protocol, clipboard and PNG-plan helpers. Published to PyPI as `grafalith`."

[lib]
name = "_grafalith"
crate-type = ["cdylib"]

# extension-module stays OFF for normal cargo builds so `cargo test`
# links libpython and runs. maturin turns it ON for wheels
# (see `features` in pyproject.toml).
[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
grafalith-bindings = { version = "0.1.0", path = "../grafalith-bindings" }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
serde_json = "1"

[lints]
workspace = true
