[package]
name = "nary-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python (PyO3/maturin) distribution of the Nary Rust engine: instance-scoped editor, JSON batch protocol, clipboard and PNG-plan helpers. Published to PyPI as `nary`."

[lib]
name = "_nary"
crate-type = ["cdylib"]

[dependencies]
nary-bindings = { version = "0.1.0", path = "../nary-bindings" }
pyo3 = { version = "0.29", features = ["extension-module", "auto-initialize"] }
serde_json = "1"

[lints]
workspace = true
