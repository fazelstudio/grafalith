[package]
name = "nary-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python (PyO3/maturin) distribution of the Nary Rust engine: instance-scoped editor, JSON batch protocol, clipboard and PNG-plan helpers. Published to PyPI as `nary`."

[lib]
name = "_nary"
crate-type = ["cdylib"]

# extension-module stays OFF for normal cargo builds so `cargo test`
# links libpython and runs. maturin turns it ON for wheels
# (see `features` in pyproject.toml).
[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
nary-bindings = { version = "0.1.0", path = "../nary-bindings" }
pyo3 = { version = "0.29", features = ["auto-initialize"] }
serde_json = "1"

[lints]
workspace = true
