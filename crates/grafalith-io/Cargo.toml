[package]
name = "grafalith-io"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["fazelstudio"]
description = "Serialization and interchange for the Grafalith Rust engine: versioned JSON schema, staged import pipeline, clipboard codec, PNG export descriptors. Host I/O (files, OS clipboard, canvas) stays outside."
repository = "https://github.com/fazelstudio/grafalith"
homepage = "https://github.com/fazelstudio/grafalith"
keywords = ["serialization", "json", "interchange", "clipboard", "graphics"]
categories = ["encoding", "graphics", "multimedia::images"]

[dependencies]
grafalith-core = { version = "0.1.0", path = "../grafalith-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# SVG import: pure Rust, WASM-safe, host-gated so default builds pay nothing.
usvg = { version = "0.48", optional = true }

# Benchmark and property harnesses for local runs.
[dev-dependencies]
criterion = "0.5"
proptest = "1"

[features]
svg = ["dep:usvg"]

# docs.rs renders with `svg` on so the usvg-gated import surface is part of
# the published documentation, not hidden behind a default-off feature.
[package.metadata.docs.rs]
features = ["svg"]

[[bench]]
name = "scale"
harness = false

[lints]
workspace = true
