[package]
name = "opennary-io"
version = "0.1.0"
edition = "2021"
description = "Serialization and interchange for the OpenNary Rust engine: versioned JSON schema, staged import pipeline, clipboard codec, PNG export descriptors. Host I/O (files, OS clipboard, canvas) stays outside."
license = "MIT"

[dependencies]
opennary-core = { version = "0.1.0", path = "../opennary-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# SVG import: pure Rust, WASM-safe, host-gated so default builds pay nothing.
usvg = { version = "0.48", optional = true }

# Benchmark and property harnesses for local runs.
[dev-dependencies]
criterion = "0.5"
proptest = "1"

[features]
svg = ["dep:usvg"]

[[bench]]
name = "scale"
harness = false

[lints]
workspace = true
